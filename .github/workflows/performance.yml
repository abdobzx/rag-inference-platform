name: Performance Testing

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'Test duration in seconds'
        required: false
        default: '60'
      users:
        description: 'Number of concurrent users'
        required: false
        default: '10'
      environment:
        description: 'Environment to test (staging/production)'
        required: false
        default: 'staging'

jobs:
  load-test:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Locust
      run: pip install locust

    - name: Create load test script
      run: |
        cat > load_test.py << 'EOF'
        from locust import HttpUser, task, between
        import json

        class SothemaAIUser(HttpUser):
            wait_time = between(1, 3)

            def on_start(self):
                # Register a test user
                response = self.client.post("/api/auth/register", json={
                    "email": f"test_{self.__class__.__name__}_{id(self)}@example.com",
                    "username": f"testuser_{id(self)}",
                    "password": "testpassword123",
                    "full_name": "Test User"
                })
                if response.status_code == 200:
                    # Login to get token
                    login_response = self.client.post("/api/token", data={
                        "username": f"testuser_{id(self)}",
                        "password": "testpassword123"
                    })
                    if login_response.status_code == 200:
                        self.token = login_response.json().get("access_token")
                        # Create API key
                        key_response = self.client.post("/api/auth/apikeys",
                            headers={"Authorization": f"Bearer {self.token}"},
                            json={"name": "Load Test Key"}
                        )
                        if key_response.status_code == 200:
                            self.api_key = key_response.json().get("key")

            @task(3)
            def health_check(self):
                self.client.get("/api/health")

            @task(2)
            def get_user_profile(self):
                if hasattr(self, 'token'):
                    self.client.get("/api/auth/me",
                        headers={"Authorization": f"Bearer {self.token}"})

            @task(1)
            def generate_text(self):
                if hasattr(self, 'api_key'):
                    self.client.post("/api/inference/generate",
                        headers={"X-API-Key": self.api_key},
                        json={"prompt": "Hello, how are you today?", "max_tokens": 50})

            @task(1)
            def list_api_keys(self):
                if hasattr(self, 'token'):
                    self.client.get("/api/auth/apikeys",
                        headers={"Authorization": f"Bearer {self.token}"})
        EOF

    - name: Run load test
      run: |
        locust --headless \
          --users ${{ github.event.inputs.users || 10 }} \
          --spawn-rate ${{ github.event.inputs.users || 10 }} \
          --run-time ${{ github.event.inputs.duration || 60 }}s \
          --host ${{ secrets.APP_URL || 'http://localhost' }} \
          --csv results \
          -f load_test.py

    - name: Upload load test results
      uses: actions/upload-artifact@v7
      with:
        name: load-test-results
        path: |
          results_*.csv
          load_test.py

    - name: Generate performance report
      run: |
        echo "## Load Test Results" >> performance_report.md
        echo "- Duration: ${{ github.event.inputs.duration || 60 }} seconds" >> performance_report.md
        echo "- Users: ${{ github.event.inputs.users || 10 }}" >> performance_report.md
        echo "- Environment: ${{ github.event.inputs.environment || 'staging' }}" >> performance_report.md
        echo "" >> performance_report.md
        echo "### Key Metrics" >> performance_report.md
        if [ -f results_stats.csv ]; then
            echo "\`\`\`csv" >> performance_report.md
            head -5 results_stats.csv >> performance_report.md
            echo "\`\`\`" >> performance_report.md
        fi

    - name: Upload performance report
      uses: actions/upload-artifact@v7
      with:
        name: performance-report
        path: performance_report.md

  benchmark:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install requests python-dotenv

    - name: Run API benchmarks
      run: |
        cat > benchmark.py << 'EOF'
        import requests
        import time
        import statistics
        from dotenv import load_dotenv
        import os

        load_dotenv()

        API_URL = os.getenv("API_URL", "http://localhost/api")
        API_KEY = os.getenv("BENCHMARK_API_KEY")

        def benchmark_endpoint(url, method="GET", data=None, headers=None, name=""):
            times = []
            for _ in range(10):  # 10 requests per endpoint
                start_time = time.time()
                try:
                    if method == "GET":
                        response = requests.get(url, headers=headers, timeout=30)
                    elif method == "POST":
                        response = requests.post(url, json=data, headers=headers, timeout=30)
                    response.raise_for_status()
                    end_time = time.time()
                    times.append(end_time - start_time)
                except Exception as e:
                    print(f"Error benchmarking {name}: {e}")
                    times.append(float('inf'))

            if times and times[0] != float('inf'):
                avg_time = statistics.mean(times)
                min_time = min(times)
                max_time = max(times)
                print(".3f")
                return avg_time
            return None

        print("🚀 Running API Benchmarks...")
        print("=" * 50)

        # Health check
        benchmark_endpoint(f"{API_URL}/health", name="Health Check")

        # Auth endpoints (if API key available)
        if API_KEY:
            headers = {"X-API-Key": API_KEY}
            benchmark_endpoint(
                f"{API_URL}/inference/generate",
                method="POST",
                data={"prompt": "Hello world", "max_tokens": 10},
                headers=headers,
                name="Text Generation"
            )
        else:
            print("⚠️  Skipping authenticated endpoints (no API key provided)")

        print("=" * 50)
        print("✅ Benchmarking complete")
        EOF

        python benchmark.py

    - name: Upload benchmark results
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-results
        path: benchmark.py