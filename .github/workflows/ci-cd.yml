name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Test job - runs on every push and PR
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        cd fastapi-microservices-app
        pip install -r auth_service/requirements.txt
        pip install -r inference_service/requirements.txt
        pip install -r gateway/requirements.txt
        pip install -r logging_service/requirements.txt

    - name: Run database migrations
      run: |
        cd fastapi-microservices-app/auth_service
        export DATABASE_URL="postgresql://test_user:test_password@localhost:5432/test_db"
        export JWT_SECRET_KEY="ci-test-secret-not-for-production"
        python migrate.py upgrade

    - name: Run auth service tests
      run: |
        cd fastapi-microservices-app/auth_service
        python -m pytest tests/ -v --cov=src --cov-report=xml
        # gateway/inference_service/logging_service don't have real automated
        # test suites yet (the previous "tests" there were unassertive smoke
        # scripts that could never fail under pytest - removed rather than
        # left as misleading coverage). Add real suites here as they land.

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: ./fastapi-microservices-app/auth_service/coverage.xml
        flags: auth-service
        name: Auth Service Coverage

  # Security scan job
  security:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  # Build and push Docker images (only on main branch)
  build-and-push:
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push auth service
      uses: docker/build-push-action@v5
      with:
        context: ./fastapi-microservices-app/auth_service
        push: true
        tags: ${{ steps.meta.outputs.tags }}-auth
        labels: ${{ steps.meta.outputs.labels }}

    - name: Build and push inference service
      uses: docker/build-push-action@v5
      with:
        context: ./fastapi-microservices-app/inference_service
        push: true
        tags: ${{ steps.meta.outputs.tags }}-inference
        labels: ${{ steps.meta.outputs.labels }}

    - name: Build and push gateway service
      uses: docker/build-push-action@v5
      with:
        context: ./fastapi-microservices-app/gateway
        push: true
        tags: ${{ steps.meta.outputs.tags }}-gateway
        labels: ${{ steps.meta.outputs.labels }}

    - name: Build and push logging service
      uses: docker/build-push-action@v5
      with:
        context: ./fastapi-microservices-app/logging_service
        push: true
        tags: ${{ steps.meta.outputs.tags }}-logging
        labels: ${{ steps.meta.outputs.labels }}

    - name: Build and push frontend
      uses: docker/build-push-action@v5
      with:
        context: ./fastapi-microservices-app/frontend_react
        push: true
        tags: ${{ steps.meta.outputs.tags }}-frontend
        labels: ${{ steps.meta.outputs.labels }}

    - name: Build and push nginx
      uses: docker/build-push-action@v5
      with:
        context: ./fastapi-microservices-app/nginx
        push: true
        tags: ${{ steps.meta.outputs.tags }}-nginx
        labels: ${{ steps.meta.outputs.labels }}

  # Deploy to staging (can be extended for production)
  deploy-staging:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    environment: staging

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to staging
      run: |
        echo "🚀 Deploying to staging environment..."
        # Add your deployment commands here
        # Example: kubectl apply -f k8s/staging/
        # Example: docker-compose -f docker-compose.staging.yml up -d
        echo "✅ Staging deployment completed"

  # Release job (for tagged releases)
  release:
    runs-on: ubuntu-latest
    needs: [test, security, build-and-push]
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create GitHub Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        body: |
          ## Changes
          See [changelog](CHANGELOG.md) for details.

          ## Docker Images
          - `ghcr.io/${{ github.repository }}:latest-auth`
          - `ghcr.io/${{ github.repository }}:latest-inference`
          - `ghcr.io/${{ github.repository }}:latest-gateway`
          - `ghcr.io/${{ github.repository }}:latest-logging`
          - `ghcr.io/${{ github.repository }}:latest-frontend`
          - `ghcr.io/${{ github.repository }}:latest-nginx`
        draft: false
        prerelease: false