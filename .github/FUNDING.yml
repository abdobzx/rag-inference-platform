# GitHub Sponsors
# Replace with your GitHub username to enable GitHub Sponsors
# github: your-username

# Patreon
# Replace with your Patreon username
# patreon: your-username

# Open Collective
# Replace with your Open Collective username
# open_collective: your-username

# Ko-fi
# Replace with your Ko-fi username
# ko_fi: your-username

# Tidelift
# Replace with your Tidelift platform/project (format: platform/project)
# tidelift: npm/your-package

# Community Bridge
# Replace with your Community Bridge project
# community_bridge: your-project

# Liberapay
# Replace with your Liberapay username
# liberapay: your-username

# IssueHunt
# Replace with your IssueHunt username
# issuehunt: your-username

# Custom sponsorship URL
# Replace with a single custom sponsorship URL
# custom: https://your-sponsorship-url.com