events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout;
    error_log /dev/stderr;

    sendfile        on;
    keepalive_timeout   65;
    client_max_body_size 10M;

    # Serveur upstream pour le service gateway (API)
    upstream gateway_api_servers {
        server gateway:8080; # Le service gateway écoute sur le port 8080 en interne
    }

    # Serveur upstream pour le service frontend_react (Interface Utilisateur React)
    # Le Dockerfile de frontend_react utilise Nginx sur le port 80 pour servir les fichiers construits.
    upstream frontend_react_servers {
        server frontend_react:80; 
    }

    server {
        listen 80;
        server_name localhost; # Remplacez par votre nom de domaine si nécessaire

        # Endpoint de santé pour Nginx
        location /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "OK\n";
        }

        # Proxy pour les appels API vers le service gateway
        # Toutes les routes commençant par /auth, /token, /inference, /logs
        # seront dirigées vers le service gateway.
        # Le service api.js dans React fait des appels vers /api/auth, /api/token etc.
        # Nous allons donc intercepter /api et le rediriger vers le gateway,
        # en supprimant le préfixe /api.
        location /api/ {
            proxy_pass http://gateway_api_servers/; # Notez le / à la fin ici
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s; # Augmenté pour les requêtes potentiellement longues
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Important: Supprimer le préfixe /api avant de transférer
            # Par exemple, /api/auth/register devient /auth/register
            rewrite ^/api/(.*)$ /$1 break;
        }
        
        # Proxy pour toutes les autres requêtes vers l'application React (frontend_react)
        # Cela inclut la racine /, /login, /register, les fichiers statiques de React, etc.
        location / {
            proxy_pass http://frontend_react_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1; # Recommandé pour keepalive avec les upstreams
            proxy_set_header Upgrade $http_upgrade; # Pour la prise en charge des WebSockets si nécessaire par Vite HMR
            proxy_set_header Connection "upgrade";
        }
    }
}