events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout;
    error_log /dev/stderr;

    sendfile        on;
    keepalive_timeout   65;
    client_max_body_size 10M;

    # Serveur upstream pour le service gateway (API)
    upstream gateway_api_servers {
        server gateway:8080; # Le service gateway écoute sur le port 8080 en interne
    }

    # Serveur upstream pour le service frontend_react (Interface Utilisateur React)
    # Le Dockerfile de frontend_react utilise Nginx sur le port 80 pour servir les fichiers construits.
    upstream frontend_react_servers {
        server frontend_react:80; 
    }

    server {
        listen 80;
        server_name localhost; # Remplacez par votre nom de domaine si nécessaire

        # Endpoint de santé pour Nginx
        location /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "OK\n";
        }

        # Nouvelle location pour /v1/gateway/
        location /v1/gateway/ {
            proxy_pass http://gateway_api_servers/; # Transférer à la racine du service gateway
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 120s; # Augmenté pour les requêtes potentiellement longues (embeddings, llm)
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;

            # Important: Supprimer le préfixe /v1/gateway/ avant de transférer
            # Par exemple, /v1/gateway/inference/embed devient /inference/embed
            rewrite ^/v1/gateway/(.*)$ /$1 break;
        }
        
        # Ancienne location /api/ - à conserver si d'autres clients l'utilisent,
        # ou à supprimer si /v1/gateway/ la remplace complètement.
        # Pour l'instant, je la laisse commentée au cas où.
        # location /api/ {
        #     proxy_pass http://gateway_api_servers/; 
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        #     proxy_connect_timeout 60s; 
        #     proxy_send_timeout 60s;
        #     proxy_read_timeout 60s;
        #     rewrite ^/api/(.*)$ /$1 break;
        # }
        
        # Proxy pour toutes les autres requêtes vers l'application React (frontend_react)
        location / {
            proxy_pass http://frontend_react_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1; 
            proxy_set_header Upgrade $http_upgrade; 
            proxy_set_header Connection "upgrade";
        }
    }
}