events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    # Configuration pour les logs
    access_log /dev/stdout;
    error_log /dev/stderr;

    # Améliorations de performance
    sendfile        on;
    keepalive_timeout   65;
    client_max_body_size 10M;
    
    # Configuration du serveur upstream pour le service de passerelle
    upstream gateway_servers {
        server gateway:8080;
    }
    
    server {
        listen 80;
        server_name localhost; # Remplacez par votre nom de domaine si nécessaire
        
        # Endpoint de santé pour Nginx
        location /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "OK\n";
        }

        # Route spécifique pour la redirection /register vers /auth/register
        location = /register {
            rewrite ^/register$ /auth/register break;
            proxy_pass http://gateway_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Gestion des timeout
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 30s;
        }

        # Redirection de toutes les requêtes vers le service de passerelle
        location / {
            proxy_pass http://gateway_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Gestion des timeout
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 30s;
        }
    }
}