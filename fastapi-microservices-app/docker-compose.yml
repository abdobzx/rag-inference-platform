version: '3.8'

services:
  postgres:
    image: postgres:13
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=sothemaai
      - POSTGRES_PASSWORD=sothemapassword
      - POSTGRES_DB=sothemaai
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sothemaai"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth_service:
    build:
      context: ./auth_service
      dockerfile: Dockerfile
    ports:
      - "8001:8000" 
    depends_on:
      postgres:
        condition: service_healthy
      logging_service:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql://sothemaai:sothemapassword@postgres:5432/sothemaai
      - EMAIL_HOST_USER=abdobzx@gmail.com  # << REMPLACEZ CECI
      - EMAIL_HOST_PASSWORD=intw zznn ffqz ymzi # << REMPLACEZ CECI
      - LOG_LEVEL=DEBUG # Ajout du niveau de log DEBUG

  inference_service:
    build:
      context: ./inference_service
      dockerfile: Dockerfile
    ports:
      - "8002:8001" 
    deploy: # Ajout pour l'accès au GPU
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1 # ou 'all' pour tous les GPUs disponibles
              capabilities: [gpu]
    depends_on:
      - logging_service

  logging_service:
    build:
      context: ./logging_service
      dockerfile: Dockerfile
    ports:
      - "8003:8002" 

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "8000:8080" 
    depends_on:
      - auth_service
      - inference_service
      - logging_service

  frontend_react: # Nouveau service pour l'application React
    build:
      context: ./frontend_react
      dockerfile: Dockerfile
    # Pas besoin de mapper de port ici si Nginx principal s'en charge.
    # Le Dockerfile de frontend_react expose déjà le port 80 pour son propre Nginx.

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - gateway
      - frontend_react # Ajout de la dépendance au frontend

networks:
  default:
    driver: bridge

volumes:
  postgres_data: