version: '3.8'

services:
  postgres:
    image: postgres:13
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-sothemaai}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      - POSTGRES_DB=${POSTGRES_DB:-sothemaai}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sothemaai}"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth_service:
    build:
      context: ./auth_service
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      logging_service:
        condition: service_started
    env_file:
      - .env.auth
    environment:
      # DB credentials come from the root .env / postgres service above, not duplicated here
      - DATABASE_URL=postgresql://${POSTGRES_USER:-sothemaai}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:-sothemaai}

  inference_service:
    build:
      context: ./inference_service
      dockerfile: Dockerfile
    env_file:
      - .env.inference
    ports:
      - "8002:8001"
    # GPU is opt-in, not required: falls back to CPU automatically (see model_loader.py).
    # To enable GPU acceleration, run with the override file instead:
    #   docker-compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
    depends_on:
      - logging_service

  logging_service:
    build:
      context: ./logging_service
      dockerfile: Dockerfile
    ports:
      - "8003:8002"

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "8000:8080"
    depends_on:
      - auth_service
      - inference_service
      - logging_service

  frontend_react:
    build:
      context: ./frontend_react
      dockerfile: Dockerfile
    # No port mapping needed here: the frontend's own Dockerfile serves via
    # an internal Nginx on port 80, fronted by the top-level nginx service below.

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - gateway
      - frontend_react

networks:
  default:
    driver: bridge

volumes:
  postgres_data: