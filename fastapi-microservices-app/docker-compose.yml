version: '3.8'

services:
  auth_service:
    build:
      context: ./auth_service
      dockerfile: Dockerfile
    ports:
      - "8001:8000" # Modifié: conteneur sur le port 8000
    depends_on:
      - logging_service

  inference_service:
    build:
      context: ./inference_service
      dockerfile: Dockerfile
    ports:
      - "8002:8001" # Modifié: conteneur sur le port 8001
    depends_on:
      - logging_service

  logging_service:
    build:
      context: ./logging_service
      dockerfile: Dockerfile
    ports:
      - "8003:8002" # Modifié: conteneur sur le port 8002

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "8000:8080" # Modifié: conteneur sur le port 8080
    depends_on:
      - auth_service
      - inference_service
      - logging_service

networks:
  default:
    driver: bridge