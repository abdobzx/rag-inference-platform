version: '3.8'

services:
  postgres:
    image: postgres:13
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=sothemaai
      - POSTGRES_PASSWORD=sothemapassword
      - POSTGRES_DB=sothemaai
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sothemaai"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth_service:
    build:
      context: ./auth_service
      dockerfile: Dockerfile
    ports:
      - "8001:8000" # Modifié: conteneur sur le port 8000
    depends_on:
      postgres:
        condition: service_healthy
      logging_service:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql://sothemaai:sothemapassword@postgres:5432/sothemaai

  inference_service:
    build:
      context: ./inference_service
      dockerfile: Dockerfile
    ports:
      - "8002:8001" # Modifié: conteneur sur le port 8001
    depends_on:
      - logging_service

  logging_service:
    build:
      context: ./logging_service
      dockerfile: Dockerfile
    ports:
      - "8003:8002" # Modifié: conteneur sur le port 8002

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "8000:8080" # Modifié: conteneur sur le port 8080
    depends_on:
      - auth_service
      - inference_service
      - logging_service

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - gateway

networks:
  default:
    driver: bridge

volumes:
  postgres_data: